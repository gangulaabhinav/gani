name: iOS validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, UI tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app/Contents/Developer ]; then
            sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          else
            echo "Xcode 27.1 is not installed; using the runner's default Xcode."
          fi
          xcodebuild -version

      - name: Select an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, candidates in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for device in candidates:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"])
                          sys.exit(0)
          sys.exit("No available iPhone simulator found")
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build app and tests while booting simulator
        id: build
        run: |
          (
            set -e
            BOOT_START=$SECONDS
            if ! xcrun simctl list devices booted | grep -q "$DEVICE_ID"; then
              xcrun simctl boot "$DEVICE_ID"
            fi
            xcrun simctl bootstatus "$DEVICE_ID" -b
            echo "Simulator ready after $((SECONDS - BOOT_START)) seconds."
          ) > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &
          BOOT_PID=$!

          BUILD_START=$SECONDS
          BUILD_STATUS=0
          xcodebuild build-for-testing \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO || BUILD_STATUS=$?
          echo "Build finished after $((SECONDS - BUILD_START)) seconds (exit $BUILD_STATUS)."

          BOOT_STATUS=0
          wait "$BOOT_PID" || BOOT_STATUS=$?
          cat "$RUNNER_TEMP/simulator-boot.log"
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::App and test build failed (exit $BUILD_STATUS)."
            exit "$BUILD_STATUS"
          fi
          if [ "$BOOT_STATUS" -ne 0 ]; then
            echo "::error::Simulator boot failed (exit $BOOT_STATUS)."
            exit "$BOOT_STATUS"
          fi

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -only-testing:ganiTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -only-testing:ganiUITests \
            -resultBundlePath TestResults/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7
