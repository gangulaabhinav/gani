name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, UI tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.6\nBuild version 17F113')"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          test "$(uname -m)" = "arm64"
          sw_vers
          sysctl hw.model machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu

      - name: Select and boot an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl create \
            gani-ci-iphone-17-pro \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build app and tests
        id: build
        run: |
          xcodebuild build-for-testing \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -only-testing:ganiTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests
        id: ui-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -only-testing:ganiUITests \
            -skip-testing:ganiUITests/LaunchPerformanceTests \
            -resultBundlePath TestResults/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: ios/TestResults/
          if-no-files-found: warn
          retention-days: 7
