name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app/Contents/Developer ]; then
            sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          else
            echo "Xcode 27.1 is not installed; using the runner's default Xcode."
          fi
          xcodebuild -version

      - name: Select and boot an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, candidates in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for device in candidates:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"])
                          sys.exit(0)
          sys.exit("No available iPhone simulator found")
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          if ! xcrun simctl list devices booted | grep -q "$DEVICE_ID"; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build app and tests
        run: |
          xcodebuild build-for-testing \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install and launch app
        run: |
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/gani.app
          xcrun simctl launch "$DEVICE_ID" com.gangulaabhinav.gani

      - name: Run unit and UI tests
        run: |
          xcodebuild test-without-building \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
