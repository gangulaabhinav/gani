name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, UI tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.6\nBuild version 17F113')"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
          test "$(uname -m)" = "arm64"
          sw_vers
          sysctl hw.model machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu

      - name: Select and boot an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl create \
            gani-ci-iphone-17-pro \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build app and tests
        id: build
        run: |
          xcodebuild build-for-testing \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -only-testing:ganiTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests
        id: ui-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building \
            -project gani.xcodeproj -scheme gani \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -only-testing:ganiUITests \
            -resultBundlePath TestResults/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export launch measurements and run environment
        if: ${{ !cancelled() && steps.ui-tests.outcome != 'skipped' && steps.build.outcome == 'success' }}
        run: |
          xcrun xcresulttool get test-results metrics \
            --path TestResults/UITests.xcresult > TestResults/LaunchMetrics.json
          xcrun xcresulttool get object --legacy --format json \
            --path TestResults/UITests.xcresult > TestResults/TestRun.json
          python3 - <<'PY'
          import json
          import math
          import os
          import plistlib
          import statistics
          from pathlib import Path

          tests = json.loads(Path("TestResults/LaunchMetrics.json").read_text())
          runs = [
              run
              for test in tests
              if test["testIdentifier"] == "LaunchPerformanceTests/testLaunchPerformance()"
              for run in test["testRuns"]
          ]
          if len(runs) != 1:
              raise SystemExit("Expected exactly one launch-performance test run")
          metrics = [
              metric for metric in runs[0]["metrics"]
              if metric["identifier"] == "com.apple.dt.XCTMetric_ApplicationLaunch-AppLaunch.duration"
          ]
          if len(metrics) != 1:
              raise SystemExit("App-launch duration metric is missing or ambiguous")
          samples = metrics[0]["measurements"]
          if len(samples) < 2 or any(not math.isfinite(value) or value <= 0 for value in samples):
              raise SystemExit("App-launch metric must contain repeated positive, finite samples")
          average = statistics.mean(samples)
          deviation = statistics.stdev(samples) / average * 100
          print(f"Launch average: {average:.6f}s; relative standard deviation: {deviation:.3f}%")
          baseline_path = Path(
              "gani.xcodeproj/xcshareddata/xcbaselines/"
              "D199499250EC4C6701CB0A50.xcbaseline/"
              "769D305F-7E71-4453-BABA-295A6365EEF5.plist"
          )
          baseline = plistlib.loads(baseline_path.read_bytes())["classNames"][
              "LaunchPerformanceTests"
          ]["testLaunchPerformance()"][metrics[0]["identifier"]]
          for actual_key, expected_key in [
              ("baselineName", "baselineIntegrationDisplayName"),
              ("baselineAverage", "baselineAverage"),
              ("maxPercentRegression", "maxPercentRegression"),
              ("maxPercentRelativeStandardDeviation", "maxPercentRelativeStandardDeviation"),
          ]:
              if metrics[0].get(actual_key) != baseline[expected_key]:
                  raise SystemExit(f"CI baseline was not applied as configured: {actual_key}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"### App launch performance\n\n"
                  f"- Samples (seconds): {', '.join(f'{value:.6f}' for value in samples)}\n"
                  f"- Mean: {average:.6f} seconds\n"
                  f"- Relative standard deviation: {deviation:.3f}%\n"
                  f"- Applied baseline: {metrics[0]['baselineAverage']:.6f} seconds\n"
                  f"- Allowed average regression: {metrics[0]['maxPercentRegression']}%\n"
                  f"- Allowed relative standard deviation: "
                  f"{metrics[0]['maxPercentRelativeStandardDeviation']}%\n"
              )
          PY

      - name: Upload test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: ios/TestResults/
          if-no-files-found: warn
          retention-days: 7
